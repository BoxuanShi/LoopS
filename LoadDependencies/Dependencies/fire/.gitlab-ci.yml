stages:          # List of stages for jobs, and their order of execution
  - test
  - build

test:
  stage: test
    #  image: dockerhub.rcc.msu.ru/docker_rcc/for_fire
  image: asmirnov80/for_fire
  script:
    - cd FIRE7
    - ./configure --enable-zlib --enable-zstd --enable-snappy --enable-tcmalloc --enable-debug
    - rm -rf extra/fuel -r
    - git submodule update --init --recursive extra/fuel
    - ls -l usr/lib
    - (ls usr/lib/liblz4.a >> /dev/null 2>&1) && echo "removing fuel usr" && rm -rf extra/fuel/usr/
    - (ls usr/lib/liblz4.a >> /dev/null 2>&1) && echo "using cache for fuel usr" && mv usr/fuel_usr extra/fuel/usr
    - ls -l extra/fuel/usr/lib || echo "no files in extra/fuel/usr/lib"
    - make fuel -j 8
    - (ls usr/lib/liblz4.a >> /dev/null 2>&1) || make dep -j 8
    - make -j 8
    - make mpi
    - make doc
    - make -f tests.makefile test_best_lib
    - make -f tests.makefile dummy_doublebox calc=flint
    - mv extra/fuel/usr usr/fuel_usr
  cache:
    key: use
    paths:
      - FIRE7/usr
  only:
    - merge_requests

sonarqube-check:
  stage: test
  image:
    name: sonarsource/sonar-scanner-cli:11.1
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  allow_failure: true
  tags:
    - sonar
  only:
    - dev

dockerhub:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    DOCKER_CONFIG: /kaniko/.docker/
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "Building image with tag $CI_COMMIT_SHORT_SHA"
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(echo -n "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" | base64)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile Dockerfile --destination $DOCKERHUB_USERNAME/fire:$CI_COMMIT_SHORT_SHA --destination $DOCKERHUB_USERNAME/fire:latest
  only:
    - dev

dockerhub_main:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    DOCKER_CONFIG: /kaniko/.docker/
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(echo -n "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" | base64)\"}}}" > /kaniko/.docker/config.json
  script:
    - export IMAGE_TAG=$(cat VERSION)
    - echo "Building image with tag $IMAGE_TAG"
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile Dockerfile --destination $DOCKERHUB_USERNAME/fire:$IMAGE_TAG --destination $DOCKERHUB_USERNAME/fire:latest
  only:
    - main
